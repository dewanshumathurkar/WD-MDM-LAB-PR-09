<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal To-Do List</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-r from-rose-500 via-pink-500 to-fuchsia-600 flex items-center justify-center">

    <div class="bg-white w-full max-w-md p-6 rounded-lg shadow-lg">

        <h1 class="text-2xl font-bold text-center mb-6">
            Personal To-Do List
        </h1>

        <div class="flex gap-2 mb-5">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task"
                class="flex-1 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
            >

            <button
                onclick="addTask()"
                class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Add
            </button>
        </div>

        <ul id="taskList" class="space-y-3"></ul>

    </div>

    <script>
        function addTask() {
            let input = document.getElementById("taskInput");
            let task = input.value.trim();

            if (task === "") {
                alert("Please enter a task.");
                return;
            }

            let li = document.createElement("li");

            li.className =
                "flex items-center justify-between bg-fuchsia-300 p-3 rounded";

            li.innerHTML = `
                <span onclick="completeTask(this)"
                      class="cursor-pointer flex-1">
                    ${task}
                </span>

                <button onclick="deleteTask(this)"
                        class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">
                    Delete
                </button>
            `;
            document.getElementById("taskList").appendChild(li);
            input.value = "";
        }
        function completeTask(task) {
            task.classList.toggle("line-through");
            task.classList.toggle("text-gray-500");
        }
        function deleteTask(button) {
            button.parentElement.remove();
        }
        document.getElementById("taskInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        });
    </script>
</body>
</html>
